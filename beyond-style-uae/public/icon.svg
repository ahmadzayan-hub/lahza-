<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Beyond Style">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A6864B"/>
      <stop offset="0.45" stop-color="#C9A96E"/>
      <stop offset="1" stop-color="#E4CFA1"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4CFA1"/>
      <stop offset="1" stop-color="#B8935A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0A0A0A"/>
  <rect x="8" y="8" width="496" height="496" rx="106" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.55"/>
  <!-- faceted brilliant-cut diamond -->
  <g stroke="#0A0A0A" stroke-width="3" stroke-linejoin="round">
    <!-- crown facets -->
    <polygon points="196,150 316,150 256,214" fill="url(#goldSoft)"/>
    <polygon points="196,150 140,230 256,214" fill="url(#gold)"/>
    <polygon points="316,150 372,230 256,214" fill="url(#gold)"/>
    <polygon points="140,230 256,214 372,230" fill="url(#goldSoft)"/>
    <!-- pavilion facets -->
    <polygon points="140,230 256,214 256,398" fill="url(#gold)"/>
    <polygon points="372,230 256,214 256,398" fill="url(#goldSoft)"/>
  </g>
  <!-- sparkle -->
  <path d="M372 120 l7 20 20 7 -20 7 -7 20 -7 -20 -20 -7 20 -7 z" fill="#E4CFA1" opacity="0.9"/>
</svg>
