name: relay-landing
# Bundles landing/ and uploads it to a short-lived public relay host so an
# external static-host build (e.g. Vercel) can fetch full-quality assets.
# The private repo stays private; the bundle contains only the public
# marketing page. Prints RELAY_URL and BUNDLE_SHA256 in the job log.
on:
  workflow_dispatch:
  push:
    branches: [claude/beyond-style-uae-landing-jqzi6a]
    paths: [".github/workflows/relay-landing.yml"]

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bundle landing
        run: |
          tar czf /tmp/landing.tgz -C landing .
          echo "BUNDLE_SHA256=$(sha256sum /tmp/landing.tgz | cut -d' ' -f1)"
          ls -la /tmp/landing.tgz

      - name: Upload to relay host
        run: |
          try_verify() {
            # verified download: same byte count as the source bundle
            SIZE=$(curl -fsSL --max-time 60 "$1" -o /tmp/check.tgz && stat -c%s /tmp/check.tgz || echo 0)
            [ "$SIZE" = "$(stat -c%s /tmp/landing.tgz)" ]
          }
          URL=$(curl -sS --max-time 60 -F "file=@/tmp/landing.tgz" https://tmpfiles.org/api/v1/upload | grep -o 'https://tmpfiles.org/[^"]*' | head -1 | sed 's#tmpfiles.org/#tmpfiles.org/dl/#' || true)
          if ! try_verify "$URL"; then
            echo "tmpfiles failed, trying litterbox (1h)"
            URL=$(curl -sS --max-time 60 -F "reqtype=fileupload" -F "time=1h" -F "fileToUpload=@/tmp/landing.tgz" https://litterbox.catbox.moe/resources/internals/api.php || true)
            try_verify "$URL" || { echo "litterbox failed, trying 0x0.st"; URL=$(curl -sS -A "relay/1.0" --max-time 60 -F "file=@/tmp/landing.tgz" https://0x0.st || true); }
          fi
          try_verify "$URL" && echo "VERIFIED_RELAY_URL=$URL" || { echo "ALL_HOSTS_FAILED"; exit 1; }
