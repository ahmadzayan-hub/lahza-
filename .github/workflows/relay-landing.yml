name: relay-landing
# Bundles landing/ and uploads it to a short-lived public relay host so an
# external static-host build (e.g. Vercel) can fetch full-quality assets.
# The private repo stays private; the bundle contains only the public
# marketing page. Prints RELAY_URL and BUNDLE_SHA256 in the job log.
on:
  workflow_dispatch:
  push:
    branches: [claude/beyond-style-uae-landing-jqzi6a]
    paths: [".github/workflows/relay-landing.yml"]

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bundle landing
        run: |
          tar czf /tmp/landing.tgz -C landing .
          echo "BUNDLE_SHA256=$(sha256sum /tmp/landing.tgz | cut -d' ' -f1)"
          ls -la /tmp/landing.tgz

      - name: Upload to relay host
        run: |
          try_verify() {
            # verified download: same byte count as the source bundle
            SIZE=$(curl -fsSL --max-time 60 "$1" -o /tmp/check.tgz && stat -c%s /tmp/check.tgz || echo 0)
            [ "$SIZE" = "$(stat -c%s /tmp/landing.tgz)" ]
          }
          sane() { case "$1" in https://*[!a-zA-Z0-9./_-]*) return 1;; https://*) return 0;; *) return 1;; esac; }
          for host in tmpfiles litterbox uguu tempsh oxo; do
            case "$host" in
              tmpfiles)  URL=$(curl -sS --max-time 60 -F "file=@/tmp/landing.tgz" https://tmpfiles.org/api/v1/upload | grep -o 'https://tmpfiles.org/[^"]*' | head -1 | sed 's#tmpfiles.org/#tmpfiles.org/dl/#' || true);;
              litterbox) URL=$(curl -sS --max-time 60 -F "reqtype=fileupload" -F "time=1h" -F "fileToUpload=@/tmp/landing.tgz" https://litterbox.catbox.moe/resources/internals/api.php || true);;
              uguu)      URL=$(curl -sS --max-time 60 -F "files[]=@/tmp/landing.tgz" https://uguu.se/upload | grep -o 'https://[a-z]*\.uguu\.se/[^"]*' | head -1 || true);;
              tempsh)    URL=$(curl -sS --max-time 60 -T /tmp/landing.tgz https://temp.sh/landing.tgz || true);;
              oxo)       URL=$(curl -sS -A "relay/1.0" --max-time 60 -F "file=@/tmp/landing.tgz" https://0x0.st || true);;
            esac
            URL=$(echo "$URL" | tr -d '[:space:]')
            if sane "$URL" && try_verify "$URL"; then echo "VERIFIED_RELAY_URL=$URL"; exit 0; fi
            echo "$host failed"
          done
          echo "ALL_HOSTS_FAILED"; exit 1
