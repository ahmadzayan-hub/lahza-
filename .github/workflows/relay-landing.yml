name: relay-landing
# Bundles landing/ and uploads it to a short-lived public relay host so an
# external static-host build (e.g. Vercel) can fetch full-quality assets.
# The private repo stays private; the bundle contains only the public
# marketing page. Prints RELAY_URL and BUNDLE_SHA256 in the job log.
on:
  workflow_dispatch:
  push:
    branches: [claude/beyond-style-uae-landing-jqzi6a]
    paths: [".github/workflows/relay-landing.yml"]

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bundle landing
        run: |
          tar czf /tmp/landing.tgz -C landing .
          echo "BUNDLE_SHA256=$(sha256sum /tmp/landing.tgz | cut -d' ' -f1)"
          ls -la /tmp/landing.tgz

      - name: Upload to relay host
        run: |
          try_verify() {
            # verified download: same byte count as the source bundle
            SIZE=$(curl -fsSL --max-time 60 "$1" -o /tmp/check.tgz && stat -c%s /tmp/check.tgz || echo 0)
            [ "$SIZE" = "$(stat -c%s /tmp/landing.tgz)" ]
          }
          # Supabase Storage relay (project beyond-style; anon key is public-by-design)
          ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmdmt5a3NjcGRienlwZmVpYWFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMDQ2OTYsImV4cCI6MjEwMTY4MDY5Nn0.4djYIRLKugda8Xb8AKwzo2w7k3toRUUe_H4SWBD0Tx8"
          BASE="https://cfvkykscpdbzypfeiaaf.supabase.co/storage/v1"
          RESP=$(curl -sS -X POST "$BASE/object/relay/landing.tgz" \
            -H "Authorization: Bearer $ANON" -H "apikey: $ANON" \
            -H "Content-Type: application/gzip" -H "x-upsert: true" \
            --data-binary @/tmp/landing.tgz -w "\nHTTP_CODE:%{http_code}")
          echo "UPLOAD_RESPONSE: $RESP"
          URL="$BASE/object/public/relay/landing.tgz"
          try_verify "$URL" && echo "VERIFIED_RELAY_URL=$URL" || { echo "SUPABASE_RELAY_FAILED"; exit 1; }
# relay attempt: policies made role-agnostic
